[package]
name = "shine-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
askama = "0.16.0"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
fontdb = "0.24.0"
base64 = "0.23.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "rustls-native-certs", "hostname", "tracing"] }
dotenvy = "0.15.7"
urlencoding = "2.1.3"
chrono = { version = "0.4", features = ["clock"] }
serde_html_form = "0.4.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 3
