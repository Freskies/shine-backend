<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Generatore Box Fluido</title>
	<link rel="stylesheet" href="fluid_box_playground.css">
</head>
<body>

<div class="sidebar">
	<h2>Generatore Curva Organica</h2>

	<div class="control-group">
		<label for="round">Forma Base: <span id="val-round">4</span></label>
		<input type="range" id="round" min="2" max="6" step="0.1" value="4" oninput="updateUI(); generateForm()">
		<small>2 = Cerchio/Ellisse. 6 = Rettangolo arrotondato.</small>
	</div>

	<div class="control-group">
		<label for="res">Risoluzione (Punti): <span id="val-res">120</span></label>
		<input type="range" id="res" min="50" max="200" step="10" value="120" oninput="updateUI(); generateForm()">
	</div>

	<div class="control-group">
		<label for="pad">Margine Interno (%): <span id="val-pad">15</span>%</label>
		<input type="range" id="pad" min="5" max="48" value="15" oninput="updateUI(); generateForm()">
		<small>Spazio interno. Impedisce il taglio ai bordi.</small>
	</div>

	<!-- MODIFICATO: Da px a % e adattato il range massimo -->
	<div class="control-group">
		<label for="amp">Ampiezza Onde (%): <span id="val-amp">8</span>%</label>
		<input type="range" id="amp" min="0" max="25" step="0.5" value="8" oninput="updateUI(); generateForm()">
		<small>L'onda non può superare il margine interno.</small>
	</div>

	<div class="control-group">
		<label for="speed">Velocità: <span id="val-speed">12</span>s</label>
		<input type="range" id="speed" min="3" max="30" value="12" oninput="updateUI(); updateSpeed()">
	</div>

	<div style="flex:1;"></div>

	<button class="btn" onclick="scrambleWaves()">Genera Nuova Sinuosità</button>
	<button class="btn btn-secondary" id="copy-btn" onclick="copyCode()">Copia Codice CSS</button>
</div>

<div class="preview-area">
	<div class="wavy-box" id="box">
		Box fluido
	</div>
	<label for="fallback-output"></label><textarea id="fallback-output" readonly></textarea>
</div>

<script src="fluid_box_playground.js"></script>
</body>
</html>
