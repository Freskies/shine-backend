<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}Shine Parkour ASD{% endblock %}</title>
	<meta name="description"
	      content="{% block description %}Shine Parkour ASD — associazione sportiva dilettantistica di parkour a Ravenna. Corsi per adulti e ragazzi, ambiente accogliente e non competitivo con istruttori certificati.{% endblock %}">

	<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96"/>
	<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
	<link rel="shortcut icon" href="/static/favicon.ico"/>
	<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png"/>
	<meta name="apple-mobile-web-app-title" content="Shine"/>
	<link rel="manifest" href="/static/site.webmanifest"/>

	<link rel="preload" href="/static/css/fonts/rubik-v31-latin-800.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/static/css/fonts/rubik-v31-latin-700.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/static/css/fonts/rubik-v31-latin-regular.woff2" as="font" type="font/woff2" crossorigin>

	<link rel="stylesheet" href="/static/css/variables.css">
	<link rel="stylesheet" href="/static/css/index.css">

	<!-- Nothing htmx drives is needed for the first paint, so it must not block parsing. -->
	<script src="/static/htmx.min.js" defer></script>
	{% block head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}

<dialog id="global-dialog" class="dialog"
        hx-on:htmx:after-swap="this.showModal(); this.scrollTop = 0"
        hx-on:click="if (event.target === this) this.close()">
	<form method="dialog" class="dialog__bar">
		<button class="dialog__close" aria-label="Chiudi">&times;</button>
	</form>
	<div id="global-dialog-content" class="dialog__body"></div>
</dialog>

<script>
	function stripHash () {
		if (window.location.href.includes("#")) {
			history.replaceState(null, "", window.location.pathname + window.location.search);
		}
	}

	stripHash();
	window.addEventListener("hashchange", stripHash);
</script>
</body>
</html>
